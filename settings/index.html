<!DOCTYPE html>
<html>
  <head>
    <!-- The '/homey.js' script must be included in your settings view to work -->
    <script
      type="text/javascript"
      src="/homey.js"
      data-origin="settings"
    ></script>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title" data-i18n="settings.title">
        <!-- This will be filled with the translated string with key 'settings.title'. -->
      </h1>
      <p class="homey-subtitle" data-i18n="settings.gateway">
        <!-- This field will also be translated -->
      </p>
      
    </header>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend">My Settings</legend>

      <div class="homey-form-group">
        <label class="homey-form-label" for="gateway">ip gateway (do not include http:// or https://)</label>
        <input class="homey-form-input" id="gateway" type="text" value="" />
      </div>
    </fieldset>

    <button id="save" class="homey-button-primary-full">Save changes</button>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend">Storage</legend>

      <p class="homey-subtitle" id="storage-status">Checking stored images&hellip;</p>
      <p class="homey-text-small" id="storage-detail"></p>

      <button id="cleanup" class="homey-button-small-full">Clean up leftover images</button>
    </fieldset>

    <script type="text/javascript">
      // a method named 'onHomeyReady' must be present in your code
      function onHomeyReady(Homey) {
        // Tell Homey we're ready to be displayed
        Homey.ready();

        var gatewayElement = document.getElementById("gateway");

        var saveElement = document.getElementById("save");

        // Ophalen van de opgeslagen waarde van 'gateway'
        Homey.get("gateway", function (err, gatewayValue) {
        if (err) return Homey.alert(err);
        // Zet de waarde van het input-element
        gatewayElement.value = gatewayValue || "";
        });




        saveElement.addEventListener("click", function (e) {
          Homey.set("gateway", gatewayElement.value, function (err) {
            if (err) return Homey.alert(err);
          });
        });

        // --- stored images ---------------------------------------------

        var statusElement = document.getElementById("storage-status");
        var detailElement = document.getElementById("storage-detail");
        var cleanupElement = document.getElementById("cleanup");

        function formatBytes(bytes) {
          if (!bytes) return "0 B";
          if (bytes < 1024) return bytes + " B";
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
          return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function refreshStorage() {
          Homey.api("GET", "/imageStorage", null, function (err, result) {
            if (err) {
              statusElement.textContent = "Could not read storage: " + err;
              return;
            }
            statusElement.textContent =
              result.files + " stored image(s), " + formatBytes(result.bytes) +
              " \u2014 " + result.orphans + " leftover (" + formatBytes(result.orphanBytes) + ")";

            var parts = [];
            Object.keys(result.byDir || {}).forEach(function (dir) {
              parts.push(dir + ": " + result.byDir[dir].files + " file(s), " +
                formatBytes(result.byDir[dir].bytes));
            });
            parts.push(result.paired + " paired device(s)");
            detailElement.textContent = parts.join(" \u00b7 ");

            cleanupElement.disabled = result.orphans === 0;
          });
        }

        cleanupElement.addEventListener("click", function () {
          cleanupElement.disabled = true;
          statusElement.textContent = "Cleaning up\u2026";
          Homey.api("POST", "/cleanupImages", null, function (err, result) {
            if (err) {
              statusElement.textContent = "Cleanup failed: " + err;
              cleanupElement.disabled = false;
              return;
            }
            Homey.alert(
              "Removed " + result.deleted + " leftover image(s), freed " +
              formatBytes(result.bytes) + "." +
              (result.failed ? " " + result.failed + " could not be removed." : "")
            );
            refreshStorage();
          });
        });

        refreshStorage();
      }
    </script>
  </body>
</html>
